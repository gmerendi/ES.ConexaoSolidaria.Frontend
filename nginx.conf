server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip para assets do Blazor
    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        application/octet-stream;

    # Assets estáticos com cache longo
    location ~* \.(js|css|wasm|dll|dat|blat|pdb|gz|br)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — toda rota desconhecida serve o index.html
    # Isso é obrigatório para o roteamento do Blazor funcionar no browser
    location / {
        try_files $uri $uri/ /index.html;
    }
}