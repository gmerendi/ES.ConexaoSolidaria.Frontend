<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conexão Solidária</title>
    <base href="/" />

    <!-- MudBlazor -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/campanha-card.css" rel="stylesheet" />

    <link rel="icon" type="image/png" href="favicon.png" />
</head>

<body>
    <div id="app">
        <div style="display:flex;justify-content:center;align-items:center;height:100vh;">
            <p>Carregando...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocorreu um erro.
        <a href="" class="reload">Recarregar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_content/Blazored.LocalStorage/blazored-localstorage.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <!-- Bibliotecas para geração do PDF no Navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        function baixarReciboPdf(elementId, nomeArquivo) {
            const elemento = document.getElementById(elementId);
            if (!elemento) {
                console.error("Elemento para PDF não encontrado: " + elementId);
                return;
            }

            const configuracoes = {
                margin: 10,
                filename: nomeArquivo,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a5', orientation: 'landscape' }
            };

            html2pdf().set(configuracoes).from(elemento).save();
        }
    </script>
</body>

</html>
